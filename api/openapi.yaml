openapi: 3.0.3
info:
  title: Warmbox API
  version: "1.1.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |
    REST API of `sbxd`, the single-node warm-pool sandbox scheduler. This
    document describes exactly what `internal/api` implements.

    ## Conventions

    * All JSON bodies are UTF-8. Request bodies are limited to 1 MiB (file
      uploads and stdin writes to the server's `--max-upload-size`, default
      256 MiB). Unknown fields in a JSON request body are rejected with
      `400 bad_request`.
    * Timestamps are RFC 3339 with up to nanosecond precision. Durations
      are integers in milliseconds and their field names end in `_ms`.
    * Byte strings inside JSON (`data`, `stdout`, `stderr`) are standard
      base64 with padding.
    * Every response carries `X-Request-Id`. A caller may supply its own in
      the request header `X-Request-Id` (at most 64 characters from
      `[A-Za-z0-9._-]`); anything else is replaced by a generated id.
    * Every error, including 404 and 405 for unknown routes, is the JSON
      envelope `{"error": {"code", "message", "request_id", "details"}}`.
      `code` is stable and meant for programs; `message` is for people.
    * A sandbox that belongs to another tenant, or to nobody (a warm
      sandbox), is indistinguishable from one that does not exist: `404
      not_found`. Ownership is never answered with `403`; that status is
      only used for a path the sandbox user may not access
      (`permission_denied`) and for the two CORS refusals below.
    * Any route can answer `504 timeout` when the server gave up waiting
      for the store or for the in-sandbox agent (30 s). It says nothing
      about whether the operation happened; for a command start, see
      `Idempotency-Key`.
    * A sandbox id looks like `sb-0123456789abcdef`. A command id (`pid`)
      is an opaque string issued by the in-sandbox agent; it is not a
      kernel pid.

    ## Credentials

    * **Tenant API key** (`sbx_<prefix>_<secret>`): `X-API-Key: <key>` or
      `Authorization: Bearer <key>`. Valid on every route under `/v1`.
    * **Sandbox access token** (`sbt_<64 hex>`, 256 random bits): returned
      once by `POST /v1/sandboxes`, stored only as a SHA-256 hash. Valid
      only on the data-plane routes (commands and files) of the sandbox it
      was issued for. Send it as `X-Access-Token: <token>`, as
      `Authorization: Bearer <token>`, as the query parameter `token`, or,
      on a WebSocket, as the subprotocol entry `sbx.token.<token>`. With a
      token and no API key, a wrong token and an unknown sandbox are both
      `401 unauthorized`.
    * **Which answer wins.** The credential is checked first, the
      sandbox's state second. A sandbox that has ended keeps its row, and
      with it the hash of its token, until the row is garbage-collected
      (7 days after it was destroyed). So for that long the *right* token
      of an ended sandbox is answered `409 sandbox_not_running` with
      `details.state` and `details.reason`: its holder is told why its
      sandbox is gone, which `401` would hide. A wrong token is `401`
      whatever the state, and after the row is gone every token is `401`.
      Either way the token opens nothing any more.

    ## Rate limits and quota

    Each tenant has two independent token buckets sized from its tenant
    row (`rate_per_sec`, `burst`): one for `POST /v1/sandboxes` and one for
    every other authenticated request (requests made with a sandbox token
    count against the owning tenant). An empty bucket is `429
    rate_limited` with `Retry-After` in seconds and `details.class`
    (`create` or `default`). A tenant at its concurrent-sandbox quota gets
    `429 quota_exceeded` from `POST /v1/sandboxes`; an empty warm pool is
    `503 pool_empty`. Both carry `Retry-After`.

    ## Sandbox lifetime

    Three independent timers end a sandbox, each with its own `reason`:
    the template's idle timeout (`idle_timeout`), the sandbox's maximum
    lifetime (`max_lifetime`, set at create with `timeout_ms` and changed
    with `POST /v1/sandboxes/{id}/timeout`, never beyond the template's
    limit), and the per-command `timeout_ms` (which ends the command, not
    the sandbox). "Activity" for the idle timer is any data-plane request
    for the sandbox and any output delivered to an attached stream or
    WebSocket; control-plane requests are not activity. Activity is
    recorded at most once per `--touch-interval` (default 5 s).

    A used sandbox is never reused: `DELETE`, a timer or a failure destroys
    the container and its storage. After a server restart every session of
    the previous process is ended with reason `host_drain`.

    ## Streaming a command (NDJSON)

    `POST .../commands?wait=stream` and `GET .../commands/{pid}/stream`
    answer `200` with `Content-Type: application/x-ndjson`: one
    `StreamEvent` JSON object per line, flushed within 20 ms.

    * **The status line and headers are sent at once**, as soon as the
      request is authorised and the agent has accepted the stream. They do
      not wait for the command to produce output, so a client may use a
      short timeout for the headers and a long (or no) timeout for the
      body. Everything that has an HTTP status (`400`, `401`, `404`,
      `409`, `429`, `502`, `504`) is detected before that point; after
      it, a failure is the stream's last line, an `error` event.
    * With `wait=stream` the first line is always the `start` event with
      the `Command` (and so its `pid`), written together with the headers
      before anything else is attempted. From then on no HTTP error is
      possible: even "the agent went away right after the start" is an
      in-stream `error` event, and the client has the pid to reattach.
    * `offset` is a single byte counter per command across stdout, stderr
      and PTY output. A client that has processed an output event resumes
      with `from = offset + len(data)`. On `start` and `error` events
      `offset` carries no information (it is `0`); ignore it there.
    * The stream ends after the `exit` event, or after an `error` event if
      it cannot continue. In-stream error codes: `sandbox_terminated`
      (final; `details.state`, `details.reason`), `shutting_down` (the
      server is stopping), `agent_unavailable` (the link to the agent
      broke; reattach with `from`), `timeout` and `internal` (reattach).
    * `keepalive` events arrive every 25 s while a command is silent. If
      `from` is older than the agent's 1 MiB replay buffer, the first
      event is `truncated` with `dropped` bytes and output resumes at
      `offset`. A slow reader never slows the command: it receives
      `truncated` events instead.

    ### Not knowing whether a command started

    If the connection is cut before the client has read the `start` event
    (or the `201` of a start without `wait`), it does not know the pid and
    must not blindly start again. Two ways out:

    * **`Idempotency-Key`** (recommended). Send the start with a header
      `Idempotency-Key: <1-128 characters of [A-Za-z0-9._:-]>` and, after
      a failure, send the same request again. The command is started at
      most once per sandbox and key: the repeat answers for the command
      the first request started, in the form its own `wait` asks for
      (`200` instead of `201` without `wait`; the `start` event and a
      replay of the output from offset 0 with `wait=stream`), with the
      response header `Idempotent-Replayed: true`. The same key with a
      different body is `409 idempotency_key_reused`. A start that failed
      is not remembered, so the key can be reused to try again. Keys are
      kept for the life of the sandbox (the newest 1024).
    * **`tag`**. Give the command a unique `tag` and, after a failure,
      look for it in `GET .../commands`: if it is listed, attach to its
      `pid` with the stream route (`from=0` replays the output); if not,
      the start did not happen. A second start with the tag of a command
      that is still running is `409 tag_in_use`, but the tag of a command
      that has exited can be taken again, so this needs the lookup.

    ## PTY and interactive I/O (WebSocket)

    `GET .../commands/{pid}/ws?from=N` upgrades to a WebSocket. The gateway
    relays the in-sandbox agent's protocol frame for frame. Every message
    is **binary**; its first byte is the channel, the rest is the payload:

    | Channel | Direction        | Payload |
    |--------:|------------------|---------|
    | 0 | client to server | stdin bytes (PTY: `0x03` is Ctrl+C, `0x04` is Ctrl+D) |
    | 1 | server to client | stdout bytes; all output of a PTY command |
    | 2 | server to client | stderr bytes (pipe mode only) |
    | 3 | server to client | JSON `WSStatusFrame`: the last frame, followed by the close |
    | 4 | client to server | JSON `{"cols":N,"rows":N}`: resize the PTY |
    | 5 | client to server | JSON `{"signal":"SIGINT"}`: signal the process group |
    | 6 | client to server | JSON `{"offset":N}`: acknowledge output up to `offset` (flow control) |
    | 7 | either           | opaque ping payload, echoed on channel 8 |
    | 8 | either           | pong |
    | 9 | server to client | JSON `{"offset":N,"dropped":M}`: always the first frame; again after a truncation |

    * Output frames carry no offset: the client counts bytes from the last
      channel-9 frame. Reattach with `from=<that count>` to continue
      without loss; the command keeps running while no client is attached.
    * Frame sizes. A frame from the server is at most 32769 bytes (1
      channel byte + 32768). Some WebSocket libraries default to a smaller
      read limit; raise it. A frame from the client is at most 1048577
      bytes: 1 channel byte + 1048576 (1 MiB) of payload. The gateway and
      the agent apply this one limit; a larger frame closes the connection
      with `1009`, and the command is unaffected.
    * Flow control is optional and end to end. Until the first channel-6
      frame the command is never paused. After it, the agent stops reading
      from the command once more than 100000 bytes are unacknowledged and
      resumes below 10000, so acknowledge every frame or in steps smaller
      than 10000 bytes. The gateway keeps no queue.
    * Subprotocols: the server selects `sbx.v1` when offered. A browser
      passes the token as `new WebSocket(url, ["sbx.v1", "sbx.token." + token])`.
    * `Origin`: without `--cors-allowed-origins` any origin is accepted,
      because authentication never relies on cookies. With it, a handshake
      from another origin that is not on the list is refused with `403
      origin_not_allowed` (see "Browsers and CORS").
    * The server sends WebSocket pings every 25 s.

    ### How a WebSocket ends

    | Close code | Reason (a stable token) | Meaning | What to do |
    |-----------:|-------------------------|---------|------------|
    | 1000 | (empty) | Follows a channel-3 frame: `exit` (the command ended), or `error` from the agent (`bad_frame`, `bad_signal`, `stdin_overflow`). | Done. |
    | 1009 | (set by the library) | A client frame exceeded 1048577 bytes. | Send smaller frames. |
    | 4000 | `sandbox_terminated`, `sandbox_not_running` | The sandbox is not running (any more). | Give up. |
    | 4001 | `unauthorized` | Missing or wrong credentials. | Give up. |
    | 4002 | `shutting_down` | The server is stopping. | Reattach later; expect 4000 if the sandbox was drained. |
    | 4003 | `agent_unavailable` | The link to the in-sandbox agent broke; the sandbox still runs. | Reattach with `from`. |
    | 4004 | `process_not_found`, `not_found` | No such command, or no such sandbox. | Give up. |
    | 4005 | `bad_request` | Malformed handshake (`from`, `handshake_errors`). | Fix the request. |
    | 4029 | `rate_limited` | The tenant's bucket is empty. | Retry after a pause. |
    | 4099 | any other API error code (`timeout`, `internal`, ...) | Unexpected. | Reattach with `from`. |

    * The close reason is the API error code as a bare token, at most 123
      bytes. Codes 4000-4099 are only ever sent by the gateway. A client
      should decide on the close code and treat an unknown 4xxx code like
      4099.
    * Whenever the connection got as far as the upgrade, a channel-3 frame
      `{"error":{"code","message"}}` with the same code precedes a 4xxx
      close, so a client that reads frames learns the reason even where
      it cannot read close codes. A connection that ends with no close
      frame at all (code 1006 in browsers) is a network failure: reattach.
    * A refused handshake is by default a plain HTTP error with the usual
      envelope (`401`, `404`, `409`, `429`, ...). Browsers cannot read
      that. With the query parameter `handshake_errors=close` the server
      accepts the upgrade instead and immediately ends the connection as
      above (status frame, then the 4xxx close). A refused `Origin` stays
      an HTTP `403` in both modes.

    ## Browsers and CORS

    Off by default: no CORS header is ever sent, `OPTIONS` is `405`, and a
    page on another origin can use nothing but the WebSocket route.
    `sbxd serve --cors-allowed-origins https://app.example.com,...` (exact
    origins, or `*` for any) turns it on **for the data-plane routes only**
    (tags `commands` and `files`), the routes a sandbox access token opens:

    * `OPTIONS` on those paths answers a preflight with `204`,
      `Access-Control-Allow-Origin`, `Access-Control-Allow-Methods`,
      `Access-Control-Allow-Headers: X-Access-Token, Content-Type, Accept,
      X-Request-Id, Idempotency-Key` and `Access-Control-Max-Age: 600`. It
      needs no credentials.
    * Responses to a configured origin carry
      `Access-Control-Allow-Origin` (that origin, or `*` if `*` is
      configured), `Vary: Origin` and `Access-Control-Expose-Headers:
      X-Request-Id, Retry-After, Location, Idempotent-Replayed,
      WWW-Authenticate`. `Access-Control-Allow-Credentials` is never
      sent: there are no cookies to send.
    * A request (or preflight, or WebSocket handshake) whose `Origin` is
      another host than the one it was sent to and is not configured is
      refused with `403 origin_not_allowed` before anything is done, and
      gets no CORS header: an origin is only ever echoed if it is on the
      list. Requests without an `Origin` header, which is every
      non-browser client, are not affected in any way.
    * **API keys stay out of browsers.** The control-plane routes take no
      part in CORS whatever is configured: they answer no preflight and
      send no CORS header, and since a tenant API key can only be sent in
      a header that requires a preflight, a page on another origin cannot
      call them. On the data-plane routes a cross-origin request that
      carries a tenant API key (`X-API-Key`, or a bearer that is not an
      `sbt_` token) is refused with `403 api_key_not_allowed`, and neither
      header is in `Access-Control-Allow-Headers`. An operator who really
      wants keys in a browser has to say so with `--cors-allow-api-key`,
      which lifts this for the data-plane routes only.
servers:
  - url: http://127.0.0.1:8080
    description: Default listen address of `sbxd serve`
tags:
  - name: sandboxes
    description: Control plane. Tenant API key only.
  - name: commands
    description: Data plane. Tenant API key or the sandbox's access token. The sandbox must be `running`.
  - name: files
    description: Data plane. Tenant API key or the sandbox's access token. The sandbox must be `running`.
  - name: templates
    description: Read-only view of the sandbox templates. Tenant API key only.
  - name: operations
    description: Unauthenticated endpoints for probes and scraping.
security:
  - ApiKey: []
  - BearerKey: []
paths:
  /v1/sandboxes:
    post:
      tags: [sandboxes]
      operationId: createSandbox
      summary: Claim a warm sandbox
      description: |
        Assigns a pre-created sandbox of the template to the tenant and
        returns it `running`. If the pool is empty the request waits for
        the server's `--claim-wait` (default 5 s) before answering `503
        pool_empty`. Counts against the tenant's `create` rate bucket.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSandboxRequest" }
      responses:
        "201":
          description: The sandbox, with its access token (shown only here).
          headers:
            Location: { schema: { type: string }, description: "`/v1/sandboxes/{id}`" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedSandbox" }
        "400":
          description: "`bad_request`, `invalid_timeout` (with `details.max_timeout_ms`) or `network_not_allowed` (the mode is looser than the template's)."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`template_not_found`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429":
          description: "`rate_limited` or `quota_exceeded`."
          headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "503":
          description: "`pool_empty` (no warm sandbox within the wait) or `shutting_down`."
          headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "504": { $ref: "#/components/responses/Timeout" }
    get:
      tags: [sandboxes]
      operationId: listSandboxes
      summary: List the tenant's sandboxes
      description: Newest assignment first.
      parameters:
        - name: state
          in: query
          description: |
            Comma-separated states to include (`assigned`, `running`,
            `recycling`, `destroyed`, `failed`, `unknown`), or `all`.
            Default: `assigned,running`, i.e. the sandboxes the tenant
            still holds. Destroyed sandboxes are kept for 7 days. (The
            value `paused`, listed by earlier versions of this document,
            is still accepted and matches nothing a client can observe.)
          schema: { type: string }
        - name: template_id
          in: query
          schema: { type: string }
        - name: metadata
          in: query
          description: "`key=value`; repeatable. Only sandboxes whose metadata contains every pair are returned."
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sandboxes]
                properties:
                  sandboxes: { type: array, items: { $ref: "#/components/schemas/Sandbox" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/sandboxes/{id}:
    parameters: [{ $ref: "#/components/parameters/SandboxID" }]
    get:
      tags: [sandboxes]
      operationId: getSandbox
      summary: Get a sandbox
      description: Also works for a sandbox that has terminated; `state` and `reason` then say how.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Sandbox" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "504": { $ref: "#/components/responses/Timeout" }
    delete:
      tags: [sandboxes]
      operationId: deleteSandbox
      summary: Kill and destroy a sandbox
      description: |
        Asynchronous by default: the `204` is sent as soon as the sandbox
        is fenced, which means its state is `recycling` with reason
        `released`, its access token opens nothing any more, its egress is
        detached and it no longer counts against the tenant's concurrency
        quota. From that moment every data-plane route answers `409
        sandbox_not_running` (with `details.state` and `details.reason:
        "released"`) to the tenant's API key and to the sandbox's own
        token alike. It is `409` and not `401` for the token on purpose:
        the credential is checked before the state, and the token still
        identifies the sandbox, so its holder is told that the sandbox is
        gone rather than that its credential is bad. A wrong token is
        `401` as always. See "Which answer wins" in the introduction.
        The container is then killed (SIGKILL, no grace period) and
        removed with all of its storage in the background, normally
        within a few hundred milliseconds; the state then becomes
        `destroyed`. A client that needs to know when that has happened
        polls `GET /v1/sandboxes/{id}` or passes `wait=true`. The
        destruction cannot be lost: if the background step fails or the
        server restarts, it is retried until it succeeds.

        With `wait=true` the response is sent only after the teardown has
        been attempted, as this route did before the parameter existed;
        the sandbox is then normally `destroyed` (it stays `recycling`,
        and is retried in the background, only if the removal failed).

        Idempotent: deleting a sandbox that is already terminated, or
        already being destroyed, is `204`.
      parameters:
        - name: wait
          in: query
          description: |
            `true`: answer after the container has been removed. `false`
            (default): answer once the sandbox is fenced.
          schema: { type: boolean, default: false }
      responses:
        "204": { description: "Released (reason `released`): fenced and being destroyed, or with `wait=true` destroyed." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/sandboxes/{id}/timeout:
    parameters: [{ $ref: "#/components/parameters/SandboxID" }]
    post:
      tags: [sandboxes]
      operationId: setSandboxTimeout
      summary: Set the remaining lifetime
      description: |
        Sets `expires_at` to now + `timeout_ms`, which may shorten or
        extend the sandbox's life. The result is silently capped at
        `started_at` + the template's `max_lifetime_ms`; read `expires_at`
        in the response for the effective value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeout_ms]
              additionalProperties: false
              properties:
                timeout_ms: { type: integer, format: int64, minimum: 1, description: Remaining lifetime from now. }
      responses:
        "200": { description: The updated sandbox., content: { application/json: { schema: { $ref: "#/components/schemas/Sandbox" } } } }
        "400":
          description: "`invalid_timeout` (not positive) or `bad_request`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotRunning" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/sandboxes/{id}/network:
    parameters: [{ $ref: "#/components/parameters/SandboxID" }]
    put:
      tags: [sandboxes]
      operationId: setSandboxNetwork
      summary: Replace the egress policy of a live sandbox
      description: |
        Takes effect before the call returns: later requests use the new
        policy, and established connections it does not permit are closed.
        The mode may be the template's or stricter. `none` locks the
        sandbox down (the proxy refuses everything) and can be reverted by
        another update. A sandbox that was created with mode `none` has no
        proxy and cannot be given one (`409 network_not_attached`). Only a
        tenant API key may call this: the sandbox token cannot change the
        policy that confines it.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NetworkPolicy" } } }
      responses:
        "200": { description: The updated sandbox., content: { application/json: { schema: { $ref: "#/components/schemas/Sandbox" } } } }
        "400":
          description: "`bad_request` (malformed policy) or `network_not_allowed` (looser than the template)."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`sandbox_not_running` or `network_not_attached`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/sandboxes/{id}/events:
    parameters: [{ $ref: "#/components/parameters/SandboxID" }]
    get:
      tags: [sandboxes]
      operationId: listSandboxEvents
      summary: The sandbox's event log
      description: |
        Every state change since the sandbox was assigned to the tenant,
        and one `command_started` and one `command_finished` event (the
        execution record) per command started through this API, oldest
        first. Available after the sandbox has terminated.
      parameters:
        - name: type
          in: query
          description: Return only events of this type.
          schema: { type: string, example: command_finished }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/Event" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/sandboxes/{id}/stats:
    parameters: [{ $ref: "#/components/parameters/SandboxID" }]
    get:
      tags: [sandboxes]
      operationId: getSandboxStats
      summary: Resource counters of a live sandbox
      description: Read from the sandbox's cgroup at the time of the call.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Stats" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`sandbox_not_running`, or `sandbox_terminated` if the instance turned out to be dead."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501":
          description: "`not_implemented`: this server was built without a stats source for its isolation backend. `sbxd` with the Podman backend always has one."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/templates:
    get:
      tags: [templates]
      operationId: listTemplates
      summary: List templates
      description: Templates are managed with `sbxd admin template`; tenants can only read them.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates: { type: array, items: { $ref: "#/components/schemas/Template" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "504": { $ref: "#/components/responses/Timeout" }

  /v1/sandboxes/{id}/commands:
    parameters: [{ $ref: "#/components/parameters/SandboxID" }]
    post:
      tags: [commands]
      operationId: startCommand
      summary: Start a command
      description: |
        Starts a process in the sandbox as uid 1000 with the session
        environment (the `env` given at create, plus proxy variables when
        the sandbox has a network), in `/workspace` unless `cwd` is set.
        Without `pty` the command runs in pipe mode: separate stdout and
        stderr, and stdin is `/dev/null` unless `stdin` is true. With
        `pty` it runs on a pseudo-terminal: one merged output stream,
        resizable.

        `wait` selects the response:

        * absent or `false`: `201` with the `Command` as soon as it has
          started. Follow it with the stream or WebSocket route.
        * `true`: `200` with a `WaitResult` when the command has exited.
          stdout and stderr are each cut at 1 MiB (`truncated`).
        * `stream`: `200` NDJSON; a `start` event, sent with the response
          headers before anything else, then the events of the stream
          route from offset 0, ending with `exit`.

        The command keeps running if the client disconnects; reconnect
        with the stream route. To make the start itself safe to repeat
        after a lost connection, send an `Idempotency-Key`; see "Not
        knowing whether a command started" in the introduction.
      security: [{ ApiKey: [] }, { BearerKey: [] }, { AccessToken: [] }, { BearerToken: [] }, { QueryToken: [] }]
      parameters:
        - name: wait
          in: query
          schema: { type: string, enum: ["false", "true", "stream"], default: "false" }
        - name: Idempotency-Key
          in: header
          description: |
            Optional. Makes the start safe to repeat: the command is
            started at most once per sandbox and key, and a repeat with
            the same body answers for that command with
            `Idempotent-Replayed: true`.
          schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StartCommandRequest" } } }
      responses:
        "200":
          description: |
            With `wait=true`, a `WaitResult`; with `wait=stream`, an NDJSON
            stream of `StreamEvent`; without `wait`, the `Command` of an
            earlier request with the same `Idempotency-Key` (a replay:
            nothing was started by this request).
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WaitResult"
                  - $ref: "#/components/schemas/Command"
            application/x-ndjson: { schema: { $ref: "#/components/schemas/StreamEvent" } }
        "201":
          description: Started (no `wait`).
          headers:
            Location: { schema: { type: string }, description: "`/v1/sandboxes/{id}/commands/{pid}`" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Command" } } }
        "400":
          description: "`bad_request`, or from the agent: `command_not_found`, `exec_format`, `bad_cwd`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`permission_denied` (the file is not executable by the sandbox user). With `--cors-allowed-origins` also `origin_not_allowed` and `api_key_not_allowed`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`sandbox_not_running`, `sandbox_terminated`, `tag_in_use`, or `idempotency_key_reused` (the key was used for a different command)."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500":
          description: "`start_failed` or `pty_failed` from the agent (for example the pids limit is exhausted), or `internal` (from the gateway or the agent)."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "502": { $ref: "#/components/responses/AgentUnavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
    get:
      tags: [commands]
      operationId: listCommands
      summary: List the sandbox's commands
      description: Running and exited commands, in start order.
      security: [{ ApiKey: [] }, { BearerKey: [] }, { AccessToken: [] }, { BearerToken: [] }, { QueryToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands: { type: array, items: { $ref: "#/components/schemas/Command" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotRunning" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/AgentUnavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/sandboxes/{id}/commands/{pid}:
    parameters: [{ $ref: "#/components/parameters/SandboxID" }, { $ref: "#/components/parameters/Pid" }]
    get:
      tags: [commands]
      operationId: getCommand
      summary: Get a command
      security: [{ ApiKey: [] }, { BearerKey: [] }, { AccessToken: [] }, { BearerToken: [] }, { QueryToken: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Command" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
        "404": { $ref: "#/components/responses/CommandNotFound" }
        "409": { $ref: "#/components/responses/NotRunning" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/AgentUnavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/sandboxes/{id}/commands/{pid}/stream:
    parameters: [{ $ref: "#/components/parameters/SandboxID" }, { $ref: "#/components/parameters/Pid" }]
    get:
      tags: [commands]
      operationId: streamCommand
      summary: Stream a command's output (NDJSON; replay then live)
      description: |
        See "Streaming a command" in the introduction. Reconnectable at
        any time, also after the command has exited, for as long as the
        sandbox lives. The response headers are sent immediately, without
        waiting for the command's first output.
      security: [{ ApiKey: [] }, { BearerKey: [] }, { AccessToken: [] }, { BearerToken: [] }, { QueryToken: [] }]
      parameters: [{ $ref: "#/components/parameters/From" }]
      responses:
        "200":
          description: One `StreamEvent` per line until `exit` or `error`. The headers do not wait for the first event.
          content: { application/x-ndjson: { schema: { $ref: "#/components/schemas/StreamEvent" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
        "404": { $ref: "#/components/responses/CommandNotFound" }
        "409": { $ref: "#/components/responses/NotRunning" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/AgentUnavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/sandboxes/{id}/commands/{pid}/stdin:
    parameters: [{ $ref: "#/components/parameters/SandboxID" }, { $ref: "#/components/parameters/Pid" }]
    post:
      tags: [commands]
      operationId: writeStdin
      summary: Write to a command's stdin
      description: "The raw request body is streamed to stdin (pipe mode started with `stdin: true`, or a PTY). Returns when the command has accepted all of it."
      security: [{ ApiKey: [] }, { BearerKey: [] }, { AccessToken: [] }, { BearerToken: [] }, { QueryToken: [] }]
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        "204": { description: Written. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
        "404": { $ref: "#/components/responses/CommandNotFound" }
        "409":
          description: "`stdin_closed` (not started with `stdin`, or already closed), `process_exited`, or `sandbox_not_running`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/AgentUnavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/sandboxes/{id}/commands/{pid}/close-stdin:
    parameters: [{ $ref: "#/components/parameters/SandboxID" }, { $ref: "#/components/parameters/Pid" }]
    post:
      tags: [commands]
      operationId: closeStdin
      summary: Close a command's stdin (EOF; pipe mode only)
      description: On a PTY, send Ctrl+D (`0x04`) to stdin instead.
      security: [{ ApiKey: [] }, { BearerKey: [] }, { AccessToken: [] }, { BearerToken: [] }, { QueryToken: [] }]
      responses:
        "204": { description: Closed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
        "404": { $ref: "#/components/responses/CommandNotFound" }
        "409":
          description: "`is_a_pty`, `stdin_closed`, `process_exited` or `sandbox_not_running`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/AgentUnavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/sandboxes/{id}/commands/{pid}/signal:
    parameters: [{ $ref: "#/components/parameters/SandboxID" }, { $ref: "#/components/parameters/Pid" }]
    post:
      tags: [commands]
      operationId: signalCommand
      summary: Signal a command's process group
      security: [{ ApiKey: [] }, { BearerKey: [] }, { AccessToken: [] }, { BearerToken: [] }, { QueryToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SignalRequest" } } }
      responses:
        "204": { description: Sent. }
        "400":
          description: "`bad_signal` or `bad_request`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
        "404": { $ref: "#/components/responses/CommandNotFound" }
        "409":
          description: "`process_exited` or `sandbox_not_running`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/AgentUnavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/sandboxes/{id}/commands/{pid}/resize:
    parameters: [{ $ref: "#/components/parameters/SandboxID" }, { $ref: "#/components/parameters/Pid" }]
    post:
      tags: [commands]
      operationId: resizeCommand
      summary: Resize a command's PTY
      security: [{ ApiKey: [] }, { BearerKey: [] }, { AccessToken: [] }, { BearerToken: [] }, { QueryToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PTYSize" } } }
      responses:
        "204": { description: Resized. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
        "404": { $ref: "#/components/responses/CommandNotFound" }
        "409":
          description: "`not_a_pty`, `process_exited` or `sandbox_not_running`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/AgentUnavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/sandboxes/{id}/commands/{pid}/ws:
    parameters: [{ $ref: "#/components/parameters/SandboxID" }, { $ref: "#/components/parameters/Pid" }]
    get:
      tags: [commands]
      operationId: attachCommand
      summary: Attach a WebSocket to a command (PTY or pipe mode)
      description: |
        See "PTY and interactive I/O" in the introduction for the framing
        and "How a WebSocket ends" for the close codes. Works for
        pipe-mode commands too (stdout on channel 1, stderr on channel 2).
      security: [{ ApiKey: [] }, { BearerKey: [] }, { AccessToken: [] }, { BearerToken: [] }, { QueryToken: [] }, { WSSubprotocolToken: [] }]
      parameters:
        - $ref: "#/components/parameters/From"
        - name: Sec-WebSocket-Protocol
          in: header
          description: "Optional. Offer `sbx.v1`; add `sbx.token.<access token>` to authenticate from a browser."
          schema: { type: string, example: "sbx.v1, sbx.token.sbt_0123..." }
        - name: handshake_errors
          in: query
          description: |
            `http` (default): a refused handshake is an HTTP error with
            the error envelope. `close`: the upgrade is accepted and the
            refusal is delivered as a channel-3 status frame followed by
            an application close code (4000-4099), for clients that
            cannot read the HTTP response of a failed handshake.
          schema: { type: string, enum: [http, close], default: http }
      responses:
        "101":
          description: |
            Switching protocols. Binary frames as described in the
            introduction. With `handshake_errors=close` this is also the
            answer to a handshake that is then refused with a close code.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
        "404": { $ref: "#/components/responses/CommandNotFound" }
        "409": { $ref: "#/components/responses/NotRunning" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/AgentUnavailable" }
        "504": { $ref: "#/components/responses/Timeout" }

  /v1/sandboxes/{id}/files:
    parameters: [{ $ref: "#/components/parameters/SandboxID" }, { $ref: "#/components/parameters/FilePath" }]
    get:
      tags: [files]
      operationId: readFile
      summary: Download a file
      description: Streamed. `Content-Length` is the file size. If the transfer fails midway the connection is aborted, so a short body is never a complete file.
      security: [{ ApiKey: [] }, { BearerKey: [] }, { AccessToken: [] }, { BearerToken: [] }, { QueryToken: [] }]
      responses:
        "200":
          description: The file's bytes.
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/FileNotFound" }
        "409":
          description: "`is_directory` (the path is a directory), `conflict` (a component of the path is a file: ENOTDIR) or `sandbox_not_running`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/AgentUnavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
    put:
      tags: [files]
      operationId: writeFile
      summary: Upload a file
      description: |
        The raw body becomes the file. Parent directories are created; the
        file appears atomically when the upload is complete; an existing
        file is replaced. The work directory is a size-capped tmpfs: an
        upload that does not fit is `507 no_space`.
      security: [{ ApiKey: [] }, { BearerKey: [] }, { AccessToken: [] }, { BearerToken: [] }, { QueryToken: [] }]
      parameters:
        - name: mode
          in: query
          description: Octal permission bits.
          schema: { type: string, pattern: "^[0-7]{3,4}$", default: "0644" }
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        "204": { description: Written. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `is_directory` (the path is a directory), `sandbox_not_running`,
            or `conflict`: a parent of the path is a file (ENOTDIR, or
            EEXIST while creating the parents), or a directory appeared at
            the path during the upload (EISDIR, ENOTEMPTY).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/AgentUnavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
        "507":
          description: "`no_space`: the sandbox's writable storage is full."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    delete:
      tags: [files]
      operationId: deleteFile
      summary: Delete a file, or a directory and everything in it
      security: [{ ApiKey: [] }, { BearerKey: [] }, { AccessToken: [] }, { BearerToken: [] }, { QueryToken: [] }]
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/FileNotFound" }
        "409": { $ref: "#/components/responses/FileConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/AgentUnavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/sandboxes/{id}/files/list:
    parameters: [{ $ref: "#/components/parameters/SandboxID" }]
    get:
      tags: [files]
      operationId: listFiles
      summary: List a directory
      description: Sorted by name; not recursive.
      security: [{ ApiKey: [] }, { BearerKey: [] }, { AccessToken: [] }, { BearerToken: [] }, { QueryToken: [] }]
      parameters:
        - name: path
          in: query
          description: Directory to list. Default is the work directory.
          schema: { type: string, default: "." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files: { type: array, items: { $ref: "#/components/schemas/FileInfo" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/FileNotFound" }
        "409": { $ref: "#/components/responses/FileConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/AgentUnavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/sandboxes/{id}/files/stat:
    parameters: [{ $ref: "#/components/parameters/SandboxID" }, { $ref: "#/components/parameters/FilePath" }]
    get:
      tags: [files]
      operationId: statFile
      summary: Describe one file or directory
      description: |
        The cheap way to ask whether a path exists and what it is: nothing
        is read or listed. A symbolic link is followed, so `is_dir` and
        `size` describe its target; a link whose target is missing is
        described as the link itself.
      security: [{ ApiKey: [] }, { BearerKey: [] }, { AccessToken: [] }, { BearerToken: [] }, { QueryToken: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FileInfo" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/FileNotFound" }
        "409": { $ref: "#/components/responses/FileConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501":
          description: |
            `not_implemented`: the sandbox runs an agent that predates
            this route (a warm sandbox created by an older server and
            adopted after an upgrade). List the parent directory instead.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "502": { $ref: "#/components/responses/AgentUnavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/sandboxes/{id}/files/mkdir:
    parameters: [{ $ref: "#/components/parameters/SandboxID" }, { $ref: "#/components/parameters/FilePath" }]
    post:
      tags: [files]
      operationId: makeDirectory
      summary: Create a directory and any missing parents
      description: |
        Succeeds if the directory already exists; the status says which it
        was. Both `201` and `204` are success with an empty body, and a
        client that does not need the distinction should accept any `2xx`
        (before the distinction existed the answer was always `204`).
      security: [{ ApiKey: [] }, { BearerKey: [] }, { AccessToken: [] }, { BearerToken: [] }, { QueryToken: [] }]
      responses:
        "201": { description: The directory was created by this request. }
        "204": { description: The directory already existed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404":
          description: "`not_found` (sandbox), or `file_not_found`: a parent cannot be created because it is a symbolic link to a missing target."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "409":
          description: "`conflict`: the path, or one of its parents, exists and is not a directory (EEXIST, ENOTDIR). Or `sandbox_not_running`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/AgentUnavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
        "507":
          description: "`no_space`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /healthz:
    get:
      tags: [operations]
